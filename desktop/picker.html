<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<title>Ekran Paylaş</title>
<style>
  /* Tokens copied from frontend/src/index.css's :root (dark palette) — this
     window isn't part of the Vite build, so it can't import that file
     directly; keep these in sync by hand if the app's palette changes. */
  :root {
    --bg-primary:   #171717;
    --bg-secondary: #262626;
    --bg-tertiary:  #0a0a0a;
    --bg-input:     #404040;

    --text-normal:  #e5e5e5;
    --text-muted:   #a3a3a3;
    --text-heading: #fafafa;

    --accent:       #f5f5f5;
    --accent-hover: #e5e5e5;
    --on-accent:    var(--bg-primary);
    --focus-ring:   var(--accent);

    --border: rgba(255, 255, 255, 0.08);
    --transition-fast: 0.15s ease;

    --font-sans: 'InterVariable', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: var(--bg-primary);
    color: var(--text-normal);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    -webkit-user-select: none;
    user-select: none;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  header {
    padding: 20px 20px 0;
    flex-shrink: 0;
  }

  h1 {
    font-size: 18px;
    font-weight: 600;
    color: var(--text-heading);
    margin: 0;
  }

  .subtitle {
    font-size: 13px;
    color: var(--text-muted);
    margin: 4px 0 0;
  }

  .tabs {
    display: flex;
    gap: 4px;
    margin: 16px 20px 0;
    border-bottom: 1px solid var(--bg-tertiary);
    flex-shrink: 0;
  }

  .tab {
    background: none;
    border: none;
    color: var(--text-muted);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 12px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }

  .tab:hover {
    color: var(--text-normal);
  }

  .tab.active {
    color: var(--text-heading);
    border-bottom-color: var(--accent);
  }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px;
  }

  .source-card {
    background: var(--bg-secondary);
    border: 2px solid transparent;
    border-radius: 8px;
    padding: 6px;
    cursor: pointer;
    text-align: left;
    transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
    font-family: inherit;
  }

  .source-card:hover {
    background: var(--bg-input);
  }

  .source-card:focus-visible {
    outline: 2px solid var(--focus-ring);
    outline-offset: 2px;
  }

  .source-card.selected {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(245, 245, 245, 0.15);
  }

  .source-thumb-wrap {
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 4px;
    overflow: hidden;
    background: var(--bg-tertiary);
  }

  .source-thumb {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .source-name {
    margin-top: 8px;
    padding: 0 2px 2px;
    font-size: 13px;
    color: var(--text-normal);
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .empty-state {
    color: var(--text-muted);
    font-size: 13px;
  }

  footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 20px;
    border-top: 1px solid var(--border);
    box-shadow: 0 -1px 0 rgba(0, 0, 0, 0.2);
    flex-shrink: 0;
  }

  .btn {
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    border: none;
    border-radius: 4px;
    padding: 10px 16px;
    cursor: pointer;
  }

  .btn-secondary {
    background: var(--bg-input);
    color: var(--text-normal);
  }

  .btn-secondary:hover {
    background: var(--bg-tertiary);
  }

  .btn-primary {
    background: var(--accent);
    color: var(--on-accent);
  }

  .btn-primary:hover:not(:disabled) {
    background: var(--accent-hover);
  }

  .btn-primary:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
</style>
</head>
<body>
  <header>
    <h1>Ekranınızı veya bir pencereyi paylaşın</h1>
    <p class="subtitle">Zircle, seçtiğiniz içeriği diğer katılımcılarla paylaşacak.</p>
  </header>

  <div class="tabs">
    <button type="button" class="tab active" data-type="screen">Ekran</button>
    <button type="button" class="tab" data-type="window">Pencere</button>
  </div>

  <main id="content">
    <p class="empty-state">Kaynaklar yükleniyor…</p>
  </main>

  <footer>
    <button type="button" class="btn btn-secondary" id="cancel-btn">İptal</button>
    <button type="button" class="btn btn-primary" id="share-btn" disabled>Paylaş</button>
  </footer>

  <script>
    let allSources = [];
    let activeType = 'screen';
    let selectedId = null;

    const content = document.getElementById('content');
    const shareBtn = document.getElementById('share-btn');
    const cancelBtn = document.getElementById('cancel-btn');
    const tabs = document.querySelectorAll('.tab');

    function shareSelected() {
      if (!selectedId) return;
      window.picker.selectSource(selectedId);
    }

    function render() {
      content.innerHTML = '';
      const sources = allSources.filter((s) => s.type === activeType);

      if (sources.length === 0) {
        const empty = document.createElement('p');
        empty.className = 'empty-state';
        empty.textContent =
          activeType === 'screen'
            ? 'Paylaşılabilecek bir ekran bulunamadı.'
            : 'Paylaşılabilecek bir pencere bulunamadı.';
        content.appendChild(empty);
        return;
      }

      const grid = document.createElement('div');
      grid.className = 'grid';

      for (const source of sources) {
        const card = document.createElement('button');
        card.type = 'button';
        card.className = 'source-card' + (source.id === selectedId ? ' selected' : '');
        card.addEventListener('click', () => {
          selectedId = source.id;
          shareBtn.disabled = false;
          render();
        });
        card.addEventListener('dblclick', () => {
          selectedId = source.id;
          shareSelected();
        });

        const thumbWrap = document.createElement('div');
        thumbWrap.className = 'source-thumb-wrap';
        const thumb = document.createElement('img');
        thumb.className = 'source-thumb';
        thumb.src = source.thumbnail;
        thumb.alt = source.name;
        thumbWrap.appendChild(thumb);
        card.appendChild(thumbWrap);

        const name = document.createElement('div');
        name.className = 'source-name';
        name.textContent = source.name;
        card.appendChild(name);

        grid.appendChild(card);
      }

      content.appendChild(grid);
    }

    tabs.forEach((tab) => {
      tab.addEventListener('click', () => {
        activeType = tab.dataset.type;
        tabs.forEach((t) => t.classList.toggle('active', t === tab));
        render();
      });
    });

    window.picker.onSources((sources) => {
      allSources = sources;
      render();
    });

    shareBtn.addEventListener('click', shareSelected);
    cancelBtn.addEventListener('click', () => window.picker.cancel());

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') window.picker.cancel();
    });
  </script>
</body>
</html>
